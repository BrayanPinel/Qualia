# infra/docker-compose.yml  (PostgreSQL para desarrollo local)
name: qualia
services:
  db-qualia:
    image: postgres:16-alpine
    container_name: postgres-qualia
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - qualia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  qualia_pgdata:
    name: qualia_postgres_data
